name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build with Idris2 latest
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: pack build selective.ipkg
