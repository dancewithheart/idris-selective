name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme curl gcc git libgmp-dev make

      - name: Install pack
        run: |
          printf 'chezscheme\n' | bash -c "$(curl -fsSL https://raw.githubusercontent.com/stefan-hoeck/idris2-pack/main/install.bash)"

      - name: Add pack to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select Idris 2
        run: |
          pack switch latest
          idris2 --version

      - name: Build package
        run: |
          pack build selective.ipkg
